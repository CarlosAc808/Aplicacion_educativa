<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fd" />
    <title>Volver a Quest Academy</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f7f8fd; color: #1a1926; font-family: system-ui, sans-serif; text-align: center; }
      main { max-width: 420px; padding: 28px; border: 1px solid #e4e7f2; border-radius: 20px; background: white; box-shadow: 0 4px 0 #dfe3ef; }
      h1 { margin-top: 0; font-size: 24px; }
      p { color: #77778a; line-height: 1.5; }
      a { display: inline-block; margin-top: 12px; padding: 14px 20px; border-radius: 12px; background: #5b36f5; color: white; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Volviendo a Quest Academy</h1>
      <p id="message">Si la aplicación no abre, pulsa el botón.</p>
      <a id="open-app" href="/">Abrir Quest Academy</a>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search)
      const sessionId = params.get('stripe_session_id')
      const cancelled = params.get('cancelled') === '1'
      const appReturn = cancelled
        ? 'questacademy://payment-cancelled'
        : `questacademy://payment-success?session_id=${encodeURIComponent(sessionId || '')}`
      const openApp = document.getElementById('open-app')
      document.getElementById('title').textContent = cancelled ? 'Pago cancelado' : 'Pago completado'
      document.getElementById('message').textContent = cancelled
        ? 'Volviendo a Quest Academy.'
        : 'Volviendo a Quest Academy. Si la aplicación no abre, pulsa el botón.'
      openApp.href = appReturn

      if ((cancelled || sessionId) && /Android/i.test(navigator.userAgent)) {
        window.location.replace(appReturn)
      }
    </script>
  </body>
</html>
